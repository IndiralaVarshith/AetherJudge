services:
  # ─────────────────────────────────────────
  # API Service (Public-facing)
  # ─────────────────────────────────────────
  api:
    build: .
    ports:
      - "5000:5000"
    env_file: .env.production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # Worker Service (Background processing)
  # ─────────────────────────────────────────
  worker:
    build: .
    command: ["node", "redisQueue/worker.js"]
    env_file: .env.production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    deploy:
      replicas: 2  # Start with 2 workers; scale later via K8s/ECS

  # ─────────────────────────────────────────
  # Redis (Message Queue + Cache)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    env_file: .env.production
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ─────────────────────────────────────────
  # PostgreSQL (Persistent Storage)
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  # ─────────────────────────────────────────
  # Nginx Reverse Proxy (Public Entry Point)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"      # Public HTTP
      # - "443:443"  # Uncomment later for HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend     # Only frontend network (isolated from DB/Redis)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3


# ─────────────────────────────────────────
# Volumes (Persistent Data)
# ─────────────────────────────────────────
volumes:
  redis-data:
  postgres-data:

# ─────────────────────────────────────────
# Networks (Isolation)
# ─────────────────────────────────────────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16  # Private subnet for internal services