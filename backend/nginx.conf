events {
    worker_connections 1024;
}

http {
    # Upstream points to your Docker service name
    upstream aether_api {
        server api:5000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers (abstract: "restricted network policies")
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Route API traffic to backend
        location /api/ {
            proxy_pass http://aether_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for SSE streaming
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Timeout settings for long-running code executions
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Auth routes (same backend, explicit for clarity)
        location /api/auth/ {
            proxy_pass http://aether_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health checks (used by orchestrators)
        location /health {
            proxy_pass http://aether_api;
            access_log off;
        }

        # Protect metrics endpoint (abstract: "observability foundations")
        location /metrics {
            deny all;
            return 403;
        }

        # Block everything else
        location / {
            return 404;
        }
    }
}